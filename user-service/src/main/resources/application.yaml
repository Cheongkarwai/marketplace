spring:
  application:
    name: user-service
  r2dbc:
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    url: r2dbc:${DATASOURCE_URL}
  webflux:
    api-version:
      supported:
        - v1
      use:
        header: X-API-VERSION
      default: v1
  messages:
    basename: messages/messages
  liquibase:
    url: jdbc:${DATASOURCE_URL}
    user: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
logging:
  level:
    org.springframework.web.reactive.result.method.annotation.ControllerMethodResolver: TRACE
    org.springframework.web: TRACE
    com.cheong.common.core.reactive: TRACE